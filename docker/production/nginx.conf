# =============================================================================
# HablaIA - Production Nginx Configuration
# =============================================================================
# Reverse proxy FastCGI + static files (frontend SPA + pictogramas)
# HTTPS via Let's Encrypt + HTTP→HTTPS redirect

upstream php-fpm {
    server backend:9000;
}

server_tokens off;

# -------------------------------------------------------------------------
# HTTP → HTTPS redirect + ACME challenge for Let's Encrypt
# -------------------------------------------------------------------------
server {
    listen 80;
    server_name damevozya.es www.damevozya.es;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://damevozya.es$request_uri;
    }
}

# -------------------------------------------------------------------------
# Redirect www → non-www (HTTPS)
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name www.damevozya.es;

    ssl_certificate /etc/letsencrypt/live/damevozya.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damevozya.es/privkey.pem;

    return 301 https://damevozya.es$request_uri;
}

# -------------------------------------------------------------------------
# Main HTTPS server
# -------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name damevozya.es;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/damevozya.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damevozya.es/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend SPA root
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers (shared include — Nginx does NOT inherit add_header
    # from server block when a location defines its own add_header)
    # -------------------------------------------------------------------------
    include /etc/nginx/security-headers.conf;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # -------------------------------------------------------------------------
    # API Backend - /api/* (FastCGI to PHP-FPM)
    # -------------------------------------------------------------------------
    location /api {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_NAME /index.php;

        # Timeouts para LLM (Groq/OpenAI pueden tardar 2-3s)
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # -------------------------------------------------------------------------
    # Pictogram images - /pictograms/* (static, cache 7d)
    # -------------------------------------------------------------------------
    location /pictograms/ {
        alias /var/www/public/pictograms/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Frontend static assets - /assets/* (Vite hashed, cache 1y)
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Slides - /slides/* (Slidev SPA, cache 1d)
    # -------------------------------------------------------------------------
    location /slides/ {
        alias /usr/share/nginx/slides/;
        index index.html;
        include /etc/nginx/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri $uri/ /slides/index.html;
    }

    # -------------------------------------------------------------------------
    # Health check (nginx-level)
    # -------------------------------------------------------------------------
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
    }

    # -------------------------------------------------------------------------
    # SPA entry point — always revalidate so deploys take effect immediately
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # -------------------------------------------------------------------------
    # Frontend SPA catch-all (Vue Router history mode)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
