# =============================================================================
# HablaIA - Production Nginx Configuration
# =============================================================================
# Reverse proxy FastCGI + static files (frontend SPA + pictogramas)

upstream php-fpm {
    server backend:9000;
}

server_tokens off;

server {
    listen 80;
    server_name _;

    # Frontend SPA root
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://static.arasaac.org data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # -------------------------------------------------------------------------
    # API Backend - /api/* (FastCGI to PHP-FPM)
    # -------------------------------------------------------------------------
    location /api {
        fastcgi_pass php-fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_NAME /index.php;

        # Timeouts para LLM (Gemini/OpenAI pueden tardar 2-3s)
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # -------------------------------------------------------------------------
    # Pictogram images - /pictograms/* (static, cache 7d)
    # -------------------------------------------------------------------------
    location /pictograms/ {
        alias /var/www/public/pictograms/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Frontend static assets - /assets/* (Vite hashed, cache 1y)
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Health check (nginx-level)
    # -------------------------------------------------------------------------
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Frontend SPA catch-all (Vue Router history mode)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
