# =============================================================================
# Shared security headers (included in every location that uses add_header)
# =============================================================================
# Nginx add_header does NOT inherit from parent blocks when a child defines
# its own add_header. This file must be included in every location that
# uses add_header to ensure security headers are always present.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://static.arasaac.org data:; connect-src 'self' https://*.ingest.de.sentry.io; font-src 'self'; frame-ancestors 'none'" always;
