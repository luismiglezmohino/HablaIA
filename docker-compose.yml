services:
  # =============================================================================
  # PostgreSQL - Base de datos principal
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hablaia_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hablaia}
      POSTGRES_USER: ${POSTGRES_USER:-hablaia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hablaia_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hablaia_network

  # =============================================================================
  # Backend - API REST Symfony 7
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: hablaia_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-hablaia_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hablaia}?serverVersion=16&charset=utf8"
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change_me_in_production_32_chars!}
      # Rate Limiting
      PHRASE_RATE_LIMIT: ${PHRASE_RATE_LIMIT:-30}
      PHRASE_RATE_INTERVAL: ${PHRASE_RATE_INTERVAL:-60}
      # Phrase Generation (fake by default for dev without API keys)
      PHRASE_PROVIDER: ${PHRASE_PROVIDER:-fake}
      PHRASE_TEMPERATURE: ${PHRASE_TEMPERATURE:-0.7}
      PHRASE_MAX_TOKENS: ${PHRASE_MAX_TOKENS:-256}
      PHRASE_TIMEOUT: ${PHRASE_TIMEOUT:-10}
      # Gemini (set PHRASE_PROVIDER=gemini to use)
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      # OpenAI (set PHRASE_PROVIDER=openai to use)
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/chat/completions}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "composer install && symfony server:start --no-tls --port=8000 --allow-all-ip"
    networks:
      - hablaia_network

  # =============================================================================
  # Frontend - SPA Vue.js 3 + TypeScript
  # =============================================================================
  frontend:
    image: node:20-alpine
    container_name: hablaia_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - hablaia_network

  # =============================================================================
  # Swagger UI - Documentación interactiva de la API
  # =============================================================================
  swagger:
    profiles: ["dev"]
    image: swaggerapi/swagger-ui:latest
    container_name: hablaia_swagger
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
      BASE_URL: /swagger
    volumes:
      - ./docs:/openapi:ro
    ports:
      - "8081:8080"
    networks:
      - hablaia_network

# =============================================================================
# Volumes - Persistencia de datos
# =============================================================================
volumes:
  postgres_data:

# =============================================================================
# Networks - Red interna
# =============================================================================
networks:
  hablaia_network:
    driver: bridge
