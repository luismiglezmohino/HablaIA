services:
  # =============================================================================
  # PostgreSQL - Base de datos principal
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hablaia_postgres
    environment:
      POSTGRES_DB: hablaia
      POSTGRES_USER: hablaia_user
      POSTGRES_PASSWORD: hablaia_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hablaia_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hablaia_network

  # =============================================================================
  # Backend - API REST Symfony 7
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: hablaia_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      DATABASE_URL: "postgresql://hablaia_user:hablaia_pass@postgres:5432/hablaia?serverVersion=16&charset=utf8"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-changeme}
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: symfony server:start --no-tls --port=8000
    networks:
      - hablaia_network

  # =============================================================================
  # Frontend - SPA Vue.js 3 + TypeScript
  # =============================================================================
  frontend:
    image: node:20-alpine
    container_name: hablaia_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - hablaia_network

# =============================================================================
# Volumes - Persistencia de datos
# =============================================================================
volumes:
  postgres_data:

# =============================================================================
# Networks - Red interna
# =============================================================================
networks:
  hablaia_network:
    driver: bridge
