# =============================================================================
# HablaIA - Backend CI
# =============================================================================
# Pipeline de integración continua para el backend Symfony

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  # ---------------------------------------------------------------------------
  # Tests y Análisis
  # ---------------------------------------------------------------------------
  test:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.4']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME_TEST || 'hablaia_test' }}
          POSTGRES_USER: ${{ secrets.DB_USER_TEST || 'hablaia_ci' }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD_TEST }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets are configured
        run: |
          if [ -z "${{ secrets.DB_PASSWORD_TEST }}" ]; then
            echo "::error::Secret DB_PASSWORD_TEST is not configured. Please add it in repository settings."
            exit 1
          fi
          if [ -z "${{ secrets.APP_SECRET_TEST }}" ]; then
            echo "::error::Secret APP_SECRET_TEST is not configured. Please add it in repository settings."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, intl, opcache
          coverage: xdebug

      - name: Create .env file
        run: |
          cat > .env << EOF
          APP_ENV=test
          APP_SECRET=${{ secrets.APP_SECRET_TEST }}
          DATABASE_URL=postgresql://${{ secrets.DB_USER_TEST || 'hablaia_ci' }}:${{ secrets.DB_PASSWORD_TEST }}@localhost:5432/${{ secrets.DB_NAME_TEST || 'hablaia_test' }}?serverVersion=16
          EOF

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
