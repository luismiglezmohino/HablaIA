framework:
    secret: '%env(APP_SECRET)%'

    http_method_override: false
    handle_all_throwables: true

    # Detrás de Nginx (Docker), Symfony ve la IP del proxy, no la del cliente real.
    # trusted_proxies permite confiar en las cabeceras X-Forwarded-* que Nginx añade,
    # para que $request->getClientIp() devuelva la IP real del usuario.
    # REMOTE_ADDR = "confía en quien me habla directamente" (Nginx en Docker).
    # En producción con load balancer: poner IPs/rangos del balanceador.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    uid:
        default_uuid_version: 7
        time_based_uuid_version: 7

    # Rate limiter for API endpoints
    rate_limiter:
        phrase_generator:
            policy: 'sliding_window'
            limit: '%env(int:PHRASE_RATE_LIMIT)%'
            interval: '%env(PHRASE_RATE_INTERVAL)% seconds'
        phrase_daily:
            policy: 'fixed_window'
            limit: '%env(int:PHRASE_DAILY_LIMIT)%'
            interval: '1 day'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # In-memory cache prevents rate limiter state from leaking between tests
        cache:
            app: cache.adapter.array
