# Cycle ORM Service Configuration
#
# Since there's no official Symfony bundle for Cycle ORM,
# we configure services manually. Only loaded in dev/prod.
#
# @see https://cycle-orm.dev/docs

when@dev:
    services:
        Cycle\Database\DatabaseManager:
            factory: ['App\Infrastructure\Persistence\Cycle\DatabaseFactory', 'create']
            arguments:
                - '%env(DATABASE_URL)%'

        Cycle\ORM\ORM:
            factory: ['App\Infrastructure\Persistence\Cycle\OrmFactory', 'create']
            arguments:
                - '@Cycle\Database\DatabaseManager'
                - '%kernel.project_dir%/src/Infrastructure/Persistence/Cycle/Entity'

        Cycle\ORM\EntityManagerInterface:
            class: Cycle\ORM\EntityManager
            arguments:
                - '@Cycle\ORM\ORM'

        App\Infrastructure\Health\CycleDatabaseHealthChecker:
            arguments:
                - '@Cycle\Database\DatabaseManager'

        App\Infrastructure\Health\DatabaseHealthCheckerInterface:
            alias: App\Infrastructure\Health\CycleDatabaseHealthChecker
            public: true

        # Cycle ORM Select\Repository instances (created dynamically from ORM)
        cycle.repository.category:
            class: Cycle\ORM\Select\Repository
            factory: ['@Cycle\ORM\ORM', 'getRepository']
            arguments:
                - App\Infrastructure\Persistence\Cycle\Entity\CategoryEntity

        cycle.repository.pictogram:
            class: Cycle\ORM\Select\Repository
            factory: ['@Cycle\ORM\ORM', 'getRepository']
            arguments:
                - App\Infrastructure\Persistence\Cycle\Entity\PictogramEntity

        cycle.repository.phrase:
            class: Cycle\ORM\Select\Repository
            factory: ['@Cycle\ORM\ORM', 'getRepository']
            arguments:
                - App\Infrastructure\Persistence\Cycle\Entity\PhraseEntity

        # Application repositories (inject Cycle repositories + EntityManager)
        App\Infrastructure\Persistence\Cycle\Repository\CycleCategoryRepository:
            arguments:
                $repository: '@cycle.repository.category'
                $entityManager: '@Cycle\ORM\EntityManagerInterface'

        App\Infrastructure\Persistence\Cycle\Repository\CyclePictogramRepository:
            arguments:
                $repository: '@cycle.repository.pictogram'
                $entityManager: '@Cycle\ORM\EntityManagerInterface'

        App\Infrastructure\Persistence\Cycle\Repository\CyclePhraseRepository:
            arguments:
                $repository: '@cycle.repository.phrase'
                $entityManager: '@Cycle\ORM\EntityManagerInterface'

when@prod:
    services:
        Cycle\Database\DatabaseManager:
            factory: ['App\Infrastructure\Persistence\Cycle\DatabaseFactory', 'create']
            arguments:
                - '%env(DATABASE_URL)%'

        Cycle\ORM\ORM:
            factory: ['App\Infrastructure\Persistence\Cycle\OrmFactory', 'create']
            arguments:
                - '@Cycle\Database\DatabaseManager'
                - '%kernel.project_dir%/src/Infrastructure/Persistence/Cycle/Entity'

        Cycle\ORM\EntityManagerInterface:
            class: Cycle\ORM\EntityManager
            arguments:
                - '@Cycle\ORM\ORM'

        App\Infrastructure\Health\CycleDatabaseHealthChecker:
            arguments:
                - '@Cycle\Database\DatabaseManager'

        App\Infrastructure\Health\DatabaseHealthCheckerInterface:
            alias: App\Infrastructure\Health\CycleDatabaseHealthChecker
            public: true

        # Cycle ORM Select\Repository instances (created dynamically from ORM)
        cycle.repository.category:
            class: Cycle\ORM\Select\Repository
            factory: ['@Cycle\ORM\ORM', 'getRepository']
            arguments:
                - App\Infrastructure\Persistence\Cycle\Entity\CategoryEntity

        cycle.repository.pictogram:
            class: Cycle\ORM\Select\Repository
            factory: ['@Cycle\ORM\ORM', 'getRepository']
            arguments:
                - App\Infrastructure\Persistence\Cycle\Entity\PictogramEntity

        cycle.repository.phrase:
            class: Cycle\ORM\Select\Repository
            factory: ['@Cycle\ORM\ORM', 'getRepository']
            arguments:
                - App\Infrastructure\Persistence\Cycle\Entity\PhraseEntity

        # Application repositories (inject Cycle repositories + EntityManager)
        App\Infrastructure\Persistence\Cycle\Repository\CycleCategoryRepository:
            arguments:
                $repository: '@cycle.repository.category'
                $entityManager: '@Cycle\ORM\EntityManagerInterface'

        App\Infrastructure\Persistence\Cycle\Repository\CyclePictogramRepository:
            arguments:
                $repository: '@cycle.repository.pictogram'
                $entityManager: '@Cycle\ORM\EntityManagerInterface'

        App\Infrastructure\Persistence\Cycle\Repository\CyclePhraseRepository:
            arguments:
                $repository: '@cycle.repository.phrase'
                $entityManager: '@Cycle\ORM\EntityManagerInterface'
