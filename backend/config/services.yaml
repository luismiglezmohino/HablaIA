parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/Entity/'
            - '../src/Domain/ValueObject/'
            - '../src/Application/DTO/'
            - '../src/Infrastructure/Persistence/Cycle/'
            - '../src/Kernel.php'

    App\Infrastructure\Http\Controller\:
        resource: '../src/Infrastructure/Http/Controller/'
        tags: ['controller.service_arguments']

    # Rate limiter for phrase generation endpoint
    App\Infrastructure\Http\Controller\PhraseController:
        arguments:
            $phraseGeneratorLimiter: '@limiter.phrase_generator'

    # Vocabulary Loader for ARASAAC sync command
    App\Infrastructure\Service\VocabularyLoaderInterface:
        class: App\Infrastructure\Service\YamlVocabularyLoader
        arguments:
            $vocabularyFilePath: '%kernel.project_dir%/config/vocabulary/core_vocabulary.yaml'

    # Image Downloader for ARASAAC sync command
    App\Infrastructure\Service\ImageDownloaderInterface:
        class: App\Infrastructure\Service\HttpImageDownloader
        arguments:
            $baseDirectory: '%kernel.project_dir%/public/pictograms'

    # ARASAAC Sync Command configuration
    App\Infrastructure\Console\SyncArasaacCommand:
        arguments:
            $pictogramsDirectory: '%kernel.project_dir%/public/pictograms'

    # Pictogram Provider configuration (ARASAAC API)
    App\Domain\Pictogram\Service\PictogramProviderInterface:
        class: App\Infrastructure\ExternalApi\Arasaac\ArasaacApiClient

    # SearchPictogram Use Case configuration
    App\Application\Pictogram\SearchPictogram:
        arguments:
            $pictogramsBasePath: '%kernel.project_dir%/public/pictograms'

    # OpenAI Phrase Generator configuration
    App\Infrastructure\ExternalApi\OpenAI\RealOpenAIPhraseGenerator:
        arguments:
            $apiUrl: '%env(OPENAI_API_URL)%'
            $apiKey: '%env(OPENAI_API_KEY)%'
            $model: '%env(OPENAI_MODEL)%'
            $temperature: '%env(float:PHRASE_TEMPERATURE)%'
            $maxTokens: '%env(int:PHRASE_MAX_TOKENS)%'
            $timeout: '%env(int:PHRASE_TIMEOUT)%'
